name: Add offline workout contract once

on:
  push:
    branches:
      - agent/murphy-method-complete-remediation

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Connect offline queue to workout contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/murphy-method-complete-remediation

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Extend workout detail and logging contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/training/training-repository.ts')
          text = path.read_text()

          edits = [
              (
                  "  /** Only present when the user has genuinely logged this exercise before. */\n  previous: PreviousPerformance | null;\n};",
                  "  /** Only present when the user has genuinely logged this exercise before. */\n  previous: PreviousPerformance | null;\n  /** Sets genuinely logged for this exercise in the current workout. */\n  loggedSetNumbers: number[];\n};",
              ),
              (
                  "  const [names, previous] = await Promise.all([\n    loadExerciseNamesAndSlugs(client, exerciseIds),\n    loadPreviousPerformance(client, userId),\n  ]);\n\n  return {",
                  "  const [names, previous] = await Promise.all([\n    loadExerciseNamesAndSlugs(client, exerciseIds),\n    loadPreviousPerformance(client, userId),\n  ]);\n\n  const workoutExerciseIds = (workoutExercises ?? []).map((row) => row.id);\n  const loggedSetNumbers = new Map<string, number[]>();\n  if (workoutExerciseIds.length > 0) {\n    const { data: currentSetLogs, error: currentSetError } = await client\n      .from('set_logs')\n      .select('workout_exercise_id, set_number')\n      .in('workout_exercise_id', workoutExerciseIds)\n      .order('set_number', { ascending: true });\n    if (currentSetError) fail('load completed sets for that workout', currentSetError);\n\n    for (const row of currentSetLogs ?? []) {\n      const values = loggedSetNumbers.get(row.workout_exercise_id) ?? [];\n      if (!values.includes(row.set_number)) values.push(row.set_number);\n      loggedSetNumbers.set(row.workout_exercise_id, values);\n    }\n  }\n\n  return {",
              ),
              (
                  "      previous: previous.get(row.exercise_id) ?? null,\n    })),",
                  "      previous: previous.get(row.exercise_id) ?? null,\n      loggedSetNumbers: loggedSetNumbers.get(row.id) ?? [],\n    })),",
              ),
              (
                  "export async function logSet(\n  client: MurphySupabaseClient,\n  input: {\n    workoutExerciseId: string;\n    setNumber: number;\n    weightKg: number | null;\n    reps: number;\n    clientGeneratedId: string;\n  },\n): Promise<void> {",
                  "export type LogSetInput = {\n  workoutExerciseId: string;\n  setNumber: number;\n  weightKg: number | null;\n  reps: number;\n  clientGeneratedId: string;\n};\n\nexport async function logSet(\n  client: MurphySupabaseClient,\n  input: LogSetInput,\n): Promise<void> {",
              ),
          ]

          for old, new in edits:
              if old not in text:
                  raise SystemExit(f'Expected training repository text not found: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - run: npx prettier --write src/services/training/training-repository.ts
      - run: npm run typecheck
      - run: git diff --check

      - name: Commit workout contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/training/training-repository.ts
          git diff --cached --quiet && exit 0
          git commit -m "Expose logged sets for offline-safe workout resume"
          git push origin HEAD:agent/murphy-method-complete-remediation
