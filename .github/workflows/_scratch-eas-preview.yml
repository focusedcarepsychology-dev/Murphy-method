name: SCRATCH — EAS preview env + Android build (one-off, do not merge)

# Temporary, throwaway workflow used to configure project-scoped EAS
# preview environment variables (plaintext, client-safe Supabase URL +
# publishable key), confirm Android build credentials, and trigger the
# first installable Android preview APK build for the combined Phase 2B
# Auth + Phase 3 onboarding real-device smoke test. Uses the existing
# EAS project (@focusedcares-team/murphy-method) only — never creates a
# new one. Not meant to be merged to main or kept around afterward.
on:
  push:
    branches: [claude/murphy-method-android-preview-ddqhun]
  workflow_dispatch:
    inputs:
      run_build:
        description: "Also trigger the Android preview build (leave false for setup/verify only)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  setup:
    name: EAS preview env vars + credentials check
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required configuration is present
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Missing required configuration: EXPO_TOKEN (repository Secret)."
            exit 1
          fi
          echo "Configuration present. (Value is never printed.)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm Expo account (owner)
        run: npx eas-cli whoami

      - name: Confirm project identity
        run: npx eas-cli project:info

      - name: Show current preview env vars (before)
        run: npx eas-cli env:list --environment preview || true

      - name: Create EXPO_PUBLIC_SUPABASE_URL (preview, plaintext)
        run: |
          npx eas-cli env:create --environment preview \
            --name EXPO_PUBLIC_SUPABASE_URL \
            --value "https://bofsldczgmgtsgwgbadt.supabase.co" \
            --visibility plaintext \
            --non-interactive \
          || echo "::warning::env:create for EXPO_PUBLIC_SUPABASE_URL failed (may already exist) — verifying via env:list below."

      - name: Create EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY (preview, plaintext)
        run: |
          npx eas-cli env:create --environment preview \
            --name EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --value "sb_publishable_BA-hxm_2Ly_lysknvvLujQ_859WWJFf" \
            --visibility plaintext \
            --non-interactive \
          || echo "::warning::env:create for EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY failed (may already exist) — verifying via env:list below."

      - name: Verify preview env vars (after)
        run: npx eas-cli env:list --environment preview

      - name: Check existing Android credentials (read-only, non-interactive)
        run: |
          timeout 30 npx eas-cli credentials --platform android --non-interactive || \
            echo "No existing non-interactive credential summary available (expected if no keystore exists yet); the Android build step will auto-provision one if needed."

      - name: Job summary
        if: always()
        run: |
          {
            echo "### EAS preview setup"
            echo ""
            echo "See step logs above for: whoami, project:info, and the verified"
            echo "preview env var list (env:list). No values are printed by env:list"
            echo "itself for secret/sensitive visibility; plaintext values may show."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Trigger Android preview build
    needs: setup
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_build == 'true'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Trigger exactly one Android preview build (non-interactive, no-wait)
        run: |
          npx eas-cli build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Android preview build triggered"
            echo ""
            echo "See the step log above for the build ID, build URL, and whether"
            echo "a new Android Keystore was generated or an existing one reused."
          } >> "$GITHUB_STEP_SUMMARY"
