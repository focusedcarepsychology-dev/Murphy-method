name: Run Supabase staging once

on:
  push:
    branches:
      - agent/murphy-method-complete-remediation

concurrency:
  group: deploy-supabase-staging-once
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    if: github.event.head_commit.message == 'Trigger Stage 3 staging deployment'
    name: Deploy remediation migrations to hosted staging once
    runs-on: ubuntu-latest
    environment: supabase-staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate protected staging configuration
        id: validate
        run: |
          set -euo pipefail
          missing=()
          [ -z "${SUPABASE_PROJECT_ID:-}" ] && missing+=("SUPABASE_PROJECT_ID environment variable")
          [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && missing+=("SUPABASE_ACCESS_TOKEN environment secret")
          [ -z "${SUPABASE_DB_PASSWORD:-}" ] && missing+=("SUPABASE_DB_PASSWORD environment secret")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required staging configuration: ${missing[*]}."
            exit 1
          fi
          if ! [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::SUPABASE_PROJECT_ID is not a valid 20-character Supabase project ref."
            exit 1
          fi
          echo "Protected staging configuration is present. Secret values will not be printed."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create deployment diagnostics directory
        run: mkdir -p deploy-artifacts

      - name: Link to hosted staging project
        id: link
        run: set -o pipefail; supabase link --project-ref "$SUPABASE_PROJECT_ID" 2>&1 | tee deploy-artifacts/link.log

      - name: Record migration state before deployment
        id: before
        run: set -o pipefail; supabase migration list --linked 2>&1 | tee deploy-artifacts/migrations-before.log

      - name: Migration dry run
        id: dryrun
        run: set -o pipefail; supabase db push --dry-run 2>&1 | tee deploy-artifacts/dry-run.log

      - name: Apply migrations to staging
        id: push
        run: set -o pipefail; supabase db push 2>&1 | tee deploy-artifacts/push.log

      - name: Run hosted-safe structural and security verification
        id: verify
        run: |
          set -o pipefail
          supabase test db supabase/tests/database/12_hosted_structural_verification.sql --linked \
            2>&1 | tee deploy-artifacts/hosted-verification.log

      - name: Record migration state after deployment
        id: after
        if: always()
        run: set -o pipefail; supabase migration list --linked 2>&1 | tee deploy-artifacts/migrations-after.log

      - name: Upload staging deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-staging-deployment-${{ github.sha }}
          path: deploy-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Post deployment result to PR 19
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          LINK_OUTCOME: ${{ steps.link.outcome }}
          BEFORE_OUTCOME: ${{ steps.before.outcome }}
          DRYRUN_OUTCOME: ${{ steps.dryrun.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          AFTER_OUTCOME: ${{ steps.after.outcome }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const results = [
              ['Protected configuration', process.env.VALIDATE_OUTCOME],
              ['Link staging project', process.env.LINK_OUTCOME],
              ['Migration state before', process.env.BEFORE_OUTCOME],
              ['Migration dry run', process.env.DRYRUN_OUTCOME],
              ['Apply migrations', process.env.PUSH_OUTCOME],
              ['Hosted structural/security verification', process.env.VERIFY_OUTCOME],
              ['Migration state after', process.env.AFTER_OUTCOME],
            ];
            const mark = (outcome) => outcome === 'success' ? '✅' : outcome === 'skipped' ? '⏭️' : '❌';
            const success = process.env.PUSH_OUTCOME === 'success' && process.env.VERIFY_OUTCOME === 'success';
            const body = [
              `## Stage 3 hosted staging deployment ${success ? 'passed' : 'needs attention'}`,
              '',
              `Source commit: \`${process.env.SOURCE_SHA}\``,
              `Workflow: ${process.env.RUN_URL}`,
              '',
              ...results.map(([label, outcome]) => `- ${mark(outcome)} ${label}: \`${outcome || 'not run'}\``),
              '',
              success
                ? '**Staging migrations were applied and hosted structural/security verification passed. Production was untouched.**'
                : '**Do not retry or repair migration history until the failed workflow step and private diagnostic artifact have been reviewed. Production was untouched.**',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 19,
              body,
            });

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Murphy Method Supabase staging deployment"
            echo ""
            echo "- Environment: \`supabase-staging\`"
            echo "- Source commit: \`${{ github.sha }}\`"
            echo "- Target: hosted staging only"
            echo "- Production: untouched"
          } >> "$GITHUB_STEP_SUMMARY"
