name: Export source audit once

on:
  push:
    branches:
      - agent/murphy-method-complete-remediation

permissions:
  contents: read

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          git archive --format=zip --output=murphy-method-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: murphy-method-source-audit
          path: murphy-method-source.zip
          if-no-files-found: error
          retention-days: 1
