name: Format Stage 1 files once

on:
  push:
    branches:
      - agent/murphy-method-complete-remediation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/murphy-method-complete-remediation

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format only the two Stage 1 test files
        run: |
          npx prettier --write \
            src/app/__tests__/new-user-zero-state.test.tsx \
            src/app/__tests__/route-guards.test.tsx
          git diff --check

      - name: Commit formatting correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/__tests__/new-user-zero-state.test.tsx \
            src/app/__tests__/route-guards.test.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Format Stage 1 integration tests"
          git push origin HEAD:agent/murphy-method-complete-remediation
