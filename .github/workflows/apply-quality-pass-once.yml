name: Apply full quality pass once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/murphy-method-complete-remediation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/murphy-method-complete-remediation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Reconstruct and verify audited source patch
        run: |
          set -euxo pipefail
          cat .github/quality-pass.xz.b64.part00 \
              .github/quality-pass.xz.b64.part01 \
              .github/quality-pass.xz.b64.part02 \
              .github/quality-pass.xz.b64.part03 \
              .github/quality-pass.xz.b64.part04 \
              .github/quality-pass.xz.b64.part05 \
              .github/quality-pass.xz.b64.part06 \
              .github/quality-pass.xz.b64.part07 > /tmp/quality-pass.xz.b64
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = Path('/tmp/quality-pass.xz.b64').read_text()
          archive = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(archive).hexdigest() == '347c3a5d9e692bc42b770ce8ec0b7b2d0953558fcd20c1ff91b9801dcfd2a699'
          patch = lzma.decompress(archive)
          assert hashlib.sha256(patch).hexdigest() == '452d71cdf592eea1edb7ec60d56f4527e6955c0bd6c8d854e8462799158e774d'
          Path('/tmp/quality-pass.patch').write_bytes(patch)
          PY

      - name: Check audited source patch
        run: git apply --check --verbose --binary /tmp/quality-pass.patch

      - name: Apply audited source patch
        run: git apply --index --verbose --binary /tmp/quality-pass.patch

      - name: Remove every one-time audit file
        run: |
          git rm .github/workflows/apply-quality-pass-once.yml
          git rm .github/quality-pass.patch.gz.b64 || true
          git rm .github/quality-pass.xz.b64.part00
          git rm .github/quality-pass.xz.b64.part01
          git rm .github/quality-pass.xz.b64.part02
          git rm .github/quality-pass.xz.b64.part03
          git rm .github/quality-pass.xz.b64.part04
          git rm .github/quality-pass.xz.b64.part05
          git rm .github/quality-pass.xz.b64.part06
          git rm .github/quality-pass.xz.b64.part07

      - name: Install dependencies
        run: npm ci

      - name: Format audited changes
        run: |
          npm run format
          git add -A
          git diff --cached --check
          git diff --cached --binary > /tmp/formatted-quality-pass.patch

      - name: Typecheck with diagnostics
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-pass-typescript-diagnostics
          path: |
            /tmp/typecheck.log
            /tmp/formatted-quality-pass.patch
          if-no-files-found: error
          retention-days: 2

      - name: Enforce TypeScript gate
        if: steps.typecheck.outcome != 'success'
        run: exit 1

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit and component tests
        run: npm test -- --ci

      - name: Expo web export
        run: npx expo export --platform web

      - name: Secret scan
        run: node ./scripts/check-no-secrets.js --bundle-dir dist

      - name: Start local Supabase
        run: supabase start

      - name: Reset clean database
        run: supabase db reset --local

      - name: Run database tests
        run: supabase test db --local

      - name: Stop local Supabase
        if: always()
        run: supabase stop

      - name: Commit verified quality pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete product quality, privacy, offline and gamification pass"
          git push origin HEAD:agent/murphy-method-complete-remediation
