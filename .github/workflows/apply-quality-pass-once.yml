name: Apply full quality pass once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/murphy-method-complete-remediation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/murphy-method-complete-remediation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply audited source patch
        run: |
          base64 --decode .github/quality-pass.patch.gz.b64 | gzip --decompress > /tmp/quality-pass.patch
          git apply --index --binary /tmp/quality-pass.patch
          git rm .github/quality-pass.patch.gz.b64 .github/workflows/apply-quality-pass-once.yml

      - name: Install and format
        run: |
          npm ci
          npm run format
          git add -A
          git diff --cached --check

      - name: Verify application
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test -- --ci
          npx expo export --platform web
          node ./scripts/check-no-secrets.js --bundle-dir dist

      - name: Verify clean database
        run: |
          supabase start
          trap 'supabase stop' EXIT
          supabase db reset --local
          supabase test db --local

      - name: Commit verified quality pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete product quality, privacy, offline and gamification pass"
          git push origin HEAD:agent/murphy-method-complete-remediation
