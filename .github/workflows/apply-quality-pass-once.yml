name: Apply full quality pass once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/murphy-method-complete-remediation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/murphy-method-complete-remediation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Reconstruct and verify audited source patch
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import lzma
          from pathlib import Path

          paths = [Path(f'.github/final-pass.part-{index:02d}') for index in range(8)]
          encoded = ''.join(path.read_text(encoding='ascii').strip() for path in paths)
          archive_hash = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          expected_archive_hash = 'a02442de3fbd7e441ad1781f8b443230ab8326df2ba022f0abada123b9c0e9ea'
          if archive_hash != expected_archive_hash:
              raise RuntimeError(f'Archive checksum mismatch: {archive_hash}')

          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          patch_hash = hashlib.sha256(patch).hexdigest()
          expected_patch_hash = '452d71cdf592eea1edb7ec60d56f4527e6955c0bd6c8d854e8462799158e774d'
          if patch_hash != expected_patch_hash:
              raise RuntimeError(f'Patch checksum mismatch: {patch_hash}')

          Path('/tmp/final-stage1.patch').write_bytes(patch)
          print(f'Verified {len(patch)} patch bytes')
          PY

      - name: Check audited source patch
        run: git apply --check --verbose --binary /tmp/final-stage1.patch

      - name: Apply audited source patch
        run: git apply --index --verbose --binary /tmp/final-stage1.patch

      - name: Remove every one-time audit file
        run: |
          git rm \
            .github/final-pass.part-00 \
            .github/final-pass.part-01 \
            .github/final-pass.part-02 \
            .github/final-pass.part-03 \
            .github/final-pass.part-04 \
            .github/final-pass.part-05 \
            .github/final-pass.part-06 \
            .github/final-pass.part-07 \
            .github/quality-pass.part-00 \
            .github/quality-pass.part-01 \
            .github/quality-pass.patch.gz.b64 \
            .github/workflows/apply-quality-pass-once.yml

      - name: Install and format
        run: |
          npm ci
          npm run format
          git add -A
          git diff --cached --check

      - name: Verify application
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test -- --ci
          npx expo export --platform web
          node ./scripts/check-no-secrets.js --bundle-dir dist

      - name: Verify clean database
        run: |
          supabase start
          trap 'supabase stop' EXIT
          supabase db reset --local
          supabase test db --local

      - name: Commit verified quality pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete product quality, privacy, offline and gamification pass"
          git push origin HEAD:agent/murphy-method-complete-remediation
