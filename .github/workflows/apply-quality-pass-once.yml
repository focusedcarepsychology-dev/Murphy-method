name: Apply full quality pass once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/murphy-method-complete-remediation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/murphy-method-complete-remediation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Decode audited source patch
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          source = Path('.github/quality-pass.patch.gz.b64').read_text(encoding='ascii')
          decoded = base64.b64decode(source, validate=True)
          patch = gzip.decompress(decoded)
          if not patch:
              raise RuntimeError('Decoded patch was empty')
          Path('/tmp/quality-pass.patch').write_bytes(patch)
          print(f'Decoded {len(patch)} patch bytes')
          PY

      - name: Check audited source patch
        run: git apply --check --verbose --binary /tmp/quality-pass.patch

      - name: Apply audited source patch
        run: git apply --index --verbose --binary /tmp/quality-pass.patch

      - name: Remove one-time audit files
        run: git rm .github/quality-pass.patch.gz.b64 .github/workflows/apply-quality-pass-once.yml

      - name: Install and format
        run: |
          npm ci
          npm run format
          git add -A
          git diff --cached --check

      - name: Verify application
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test -- --ci
          npx expo export --platform web
          node ./scripts/check-no-secrets.js --bundle-dir dist

      - name: Verify clean database
        run: |
          supabase start
          trap 'supabase stop' EXIT
          supabase db reset --local
          supabase test db --local

      - name: Commit verified quality pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete product quality, privacy, offline and gamification pass"
          git push origin HEAD:agent/murphy-method-complete-remediation
