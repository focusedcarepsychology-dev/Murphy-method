name: Final remediation normalization once

on:
  push:
    branches:
      - agent/murphy-method-complete-remediation

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/murphy-method-complete-remediation

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply reviewed pgTAP corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          equipment = Path('supabase/tests/database/14_equipment_semantics.sql')
          text = equipment.read_text()
          if text.count('select no_plan();') != 1:
              raise SystemExit('Unexpected equipment test plan')
          if text.count('rollback;') != 4:
              raise SystemExit(f'Expected four rollback blocks, found {text.count("rollback;")}')
          text = text.replace('select no_plan();', 'select plan(14);', 1)
          text = text.replace('rollback;', 'commit;')
          equipment.write_text(text)

          ontology = Path('supabase/tests/database/14_exercise_ontology_seed.sql')
          text = ontology.read_text()
          old = "where e.source = 'internal_authoring'\n       and not exists"
          if text.count(old) != 2:
              raise SystemExit('Unexpected ontology v1 scope')
          ontology.write_text(text.replace(old, "where e.dataset_version = '1'\n       and not exists"))

          programme = Path('supabase/tests/database/15_real_programme_engine.sql')
          text = programme.read_text()
          if text.count('select plan(15);') != 1:
              raise SystemExit('Unexpected programme test plan')
          old = """select throws_ok(
            $$ select public.build_real_programme_structure('15000000-0000-4000-8000-000000000001') $$,
            '42501',
            null,
            'build_real_programme_structure is not directly callable by authenticated clients'
          );"""
          new = """select is(
            has_function_privilege(
              'authenticated',
              'public.build_real_programme_structure(uuid)',
              'EXECUTE'
            ),
            false,
            'build_real_programme_structure is not executable by authenticated clients'
          );"""
          if text.count(old) != 1:
              raise SystemExit('Unexpected internal-helper permission assertion')
          text = text.replace('select plan(15);', 'select plan(16);', 1).replace(old, new, 1)
          programme.write_text(text)
          PY

      - name: Install and format
        run: |
          npm ci
          npm run format
          git diff --check

      - name: Commit normalized source and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No normalization changes required."
          else
            git commit -m "Normalize remediation source and database tests"
            git push origin HEAD:agent/murphy-method-complete-remediation
          fi
