name: Install compatible haptics package once

on:
  push:
    branches:
      - agent/murphy-method-complete-remediation

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  install:
    if: github.event.head_commit.message == 'Retry Expo haptics installation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/murphy-method-complete-remediation

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Install Expo-compatible haptics package
        id: install
        run: CI=1 npx expo install expo-haptics
      - name: Typecheck dependency result
        id: typecheck
        run: npm run typecheck
      - run: git diff --check

      - name: Commit dependency files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Add Expo haptics dependency"
          git push origin HEAD:agent/murphy-method-complete-remediation
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Report result to PR 19
        if: always()
        uses: actions/github-script@v7
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        with:
          script: |
            const ok = process.env.INSTALL_OUTCOME === 'success' && process.env.TYPECHECK_OUTCOME === 'success' && process.env.COMMIT_OUTCOME === 'success';
            const body = [
              `## Expo haptics dependency ${ok ? 'ready' : 'needs attention'}`,
              '',
              `- Install: \`${process.env.INSTALL_OUTCOME}\``,
              `- Typecheck: \`${process.env.TYPECHECK_OUTCOME}\``,
              `- Dependency commit: \`${process.env.COMMIT_OUTCOME}\``,
              `- package files changed: \`${process.env.CHANGED || 'unknown'}\``,
              '',
              ok
                ? 'The Expo-compatible package version was resolved and committed on the remediation branch.'
                : 'No haptic integration should be added until the failed workflow step is reviewed.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 19,
              body,
            });
