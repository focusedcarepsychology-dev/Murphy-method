name: CI

on:
  pull_request:
  push:
    branches: [main]

# Avoid piling up redundant runs when new commits land on the same PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck / lint / format / test / export / secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create diagnostic directory
        run: mkdir -p ci-artifacts

      - name: Package source audit snapshot
        run: git archive --format=zip --output=ci-artifacts/murphy-method-source.zip HEAD

      - name: Upload source audit snapshot
        uses: actions/upload-artifact@v4
        with:
          name: murphy-method-source-audit
          path: ci-artifacts/murphy-method-source.zip
          if-no-files-found: error
          retention-days: 1

      - name: Typecheck
        run: set -o pipefail; npm run typecheck 2>&1 | tee ci-artifacts/typecheck.log

      - name: Lint
        run: set -o pipefail; npm run lint 2>&1 | tee ci-artifacts/lint.log

      - name: Format check
        run: set -o pipefail; npm run format:check 2>&1 | tee ci-artifacts/format.log

      - name: Unit / component tests
        run: set -o pipefail; npm test -- --ci 2>&1 | tee ci-artifacts/tests.log

      - name: Expo web export (build validation)
        run: set -o pipefail; npx expo export --platform web 2>&1 | tee ci-artifacts/export.log

      - name: Secret-leak check (source + exported bundle)
        run: set -o pipefail; node ./scripts/check-no-secrets.js --bundle-dir dist 2>&1 | tee ci-artifacts/secrets.log

      - name: Upload app diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-ci-diagnostics
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

  database:
    name: Database (migrations / RLS pgTAP tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create diagnostic directory
        run: mkdir -p ci-artifacts

      - name: Start local Supabase stack
        run: set -o pipefail; supabase start 2>&1 | tee ci-artifacts/supabase-start.log

      - name: Reset database (applies every migration from a clean database)
        run: set -o pipefail; supabase db reset --local 2>&1 | tee ci-artifacts/database-reset.log

      - name: Run pgTAP RLS/database test suite
        run: set -o pipefail; supabase test db --local 2>&1 | tee ci-artifacts/database-tests.log

      - name: Upload database diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-ci-diagnostics
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
