name: Format remediation branch once

on:
  push:
    branches:
      - agent/murphy-method-complete-remediation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/murphy-method-complete-remediation

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "Format remediation source"
            git push origin HEAD:agent/murphy-method-complete-remediation
          fi
