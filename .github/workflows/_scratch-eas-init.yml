name: SCRATCH — EAS project init (one-off, do not merge)

# Temporary, throwaway workflow used to perform exactly one authenticated
# EAS linking operation (`eas init --non-interactive`) with EXPO_TOKEN and
# report back the resulting project identity, so the confirmed
# extra.eas.projectId can be committed by hand on a separate, minimal
# branch. Not meant to be merged to main or kept around afterward.
#
# Re-run 2: EXPO_TOKEN re-saved as a repository secret after the first
# attempt found it empty.
# Re-run 3: EXPO_TOKEN re-issued (old one revoked as invalid) and
# re-saved. `whoami` now succeeds — authenticated as the
# focusedcares-team account. The no-`--force` `eas init` step then
# failed with "Project does not exist: @focusedcares-team/murphy-method.
# Use --force flag to create this project." — proof positive that no
# project with this slug exists yet under this account, so there is no
# duplicate to link to. `--force` is added below to let `eas init`
# actually create the one new project now that absence is confirmed.
on:
  push:
    branches: [claude/eas-init-scratch]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  init:
    name: eas init (non-interactive)
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required configuration is present
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Missing required configuration: EXPO_TOKEN (repository Secret)."
            exit 1
          fi
          echo "Configuration present. (Value is never printed.)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm Expo account (owner)
        run: npx eas-cli whoami

      - name: Link or create exactly one EAS project (non-interactive)
        # No --id: lets the CLI resolve by the existing app.json slug —
        # if a project with this slug already exists under the
        # authenticated account, it links to that one (no duplicate is
        # created); only if none exists does it create a new one.
        # --force: the prior run (without --force) confirmed no project
        # named @focusedcares-team/murphy-method exists yet — that is
        # the only condition --force bypasses for `eas init`, so this
        # cannot silently pick an ambiguous/wrong existing project; it
        # only unblocks creating the single new one already confirmed
        # absent.
        run: npx eas-cli init --non-interactive --force

      - name: Confirm resulting project identity
        run: npx eas-cli project:info

      - name: Show the resulting app.json change (no secrets in this diff)
        run: git --no-pager diff app.json

      - name: Check for a GitHub repository connection on this EAS project
        run: |
          echo "--- eas-cli top-level help (looking for a github-connection subcommand) ---"
          npx eas-cli --help || true
          echo "--- eas-cli project:info --json (looking for a github/repository field) ---"
          npx eas-cli project:info --json || true

      - name: Job summary
        if: always()
        run: |
          {
            echo "### EAS project init"
            echo ""
            echo "See the step logs above for: Expo owner (whoami), resulting project"
            echo "identity (project:info), and the exact app.json diff (extra.eas.projectId)."
            echo "This workflow does not commit or push anything — apply the same"
            echo "projectId by hand on a separate, minimal branch."
          } >> "$GITHUB_STEP_SUMMARY"
