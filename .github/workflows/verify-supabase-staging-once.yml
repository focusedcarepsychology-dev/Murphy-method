name: Verify Supabase Staging Once

on:
  push:
    branches:
      - agent/murphy-method-complete-remediation
    paths:
      - .github/staging-verify.trigger

concurrency:
  group: deploy-supabase-staging
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify hosted staging schema and security
    runs-on: ubuntu-latest
    environment: supabase-staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/murphy-method-complete-remediation
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify hosted staging and prepare safe report
        id: verification
        shell: bash
        run: |
          set +e
          mkdir -p staging-verification

          config_ok=1
          missing=()
          [ -z "${SUPABASE_PROJECT_ID:-}" ] && missing+=("SUPABASE_PROJECT_ID")
          [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && missing+=("SUPABASE_ACCESS_TOKEN")
          [ -z "${SUPABASE_DB_PASSWORD:-}" ] && missing+=("SUPABASE_DB_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            config_ok=0
          fi
          if [ "$config_ok" -eq 1 ] && ! [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]; then
            config_ok=0
            missing+=("SUPABASE_PROJECT_ID_FORMAT")
          fi

          if [ "${#missing[@]}" -eq 0 ]; then
            missing_summary="none"
          else
            missing_summary="${missing[*]}"
          fi

          link_status=99
          migration_status=99
          dry_run_status=99
          structural_status=99

          if [ "$config_ok" -eq 1 ]; then
            supabase link --project-ref "$SUPABASE_PROJECT_ID" > staging-verification/link.log 2>&1
            link_status=$?

            if [ "$link_status" -eq 0 ]; then
              supabase migration list --linked > staging-verification/migrations.log 2>&1
              migration_status=$?

              supabase db push --dry-run > staging-verification/dry-run.log 2>&1
              dry_run_status=$?

              supabase test db supabase/tests/database/12_hosted_structural_verification.sql --linked \
                > staging-verification/hosted-verification.log 2>&1
              structural_status=$?
            fi
          else
            printf 'Missing or invalid protected configuration names: %s\n' "$missing_summary" \
              > staging-verification/configuration.log
          fi

          if [ "$config_ok" -eq 1 ] && [ "$link_status" -eq 0 ] && \
             [ "$migration_status" -eq 0 ] && [ "$dry_run_status" -eq 0 ] && \
             [ "$structural_status" -eq 0 ]; then
            overall="PASS"
          else
            overall="FAIL"
          fi

          timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat > docs/STAGING_DEPLOYMENT_VERIFICATION.md <<EOF
          # Supabase staging deployment verification

          - Result: **${overall}**
          - Environment: \`supabase-staging\`
          - Reviewed application source: \`146eee2877e3a36949d3397dba63138ac85578b2\`
          - Verified at: \`${timestamp}\`
          - Configuration present and correctly shaped: \`${config_ok}\`
          - Missing or invalid configuration names: \`${missing_summary}\`
          - Hosted project link exit code: \`${link_status}\`
          - Migration-state command exit code: \`${migration_status}\`
          - Migration dry-run exit code: \`${dry_run_status}\`
          - Hosted structural/security verification exit code: \`${structural_status}\`
          - Production: **untouched**

          Detailed command logs are retained privately in the workflow artifact. No credentials or project reference are written to this report.
          EOF

          echo "overall=$overall" >> "$GITHUB_OUTPUT"

      - name: Upload private verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-staging-verification
          path: staging-verification/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit safe verification report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STAGING_DEPLOYMENT_VERIFICATION.md
          git commit -m "Record hosted Supabase staging verification"
          git push origin HEAD:agent/murphy-method-complete-remediation

      - name: Enforce verification result
        if: always()
        env:
          OVERALL: ${{ steps.verification.outputs.overall }}
        run: test "$OVERALL" = PASS
