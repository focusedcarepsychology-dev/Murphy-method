name: Deploy Supabase (Staging)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY STAGING to confirm this non-production migration deployment
        required: true
        type: string
  push:
    branches:
      - agent/murphy-method-complete-remediation
    paths:
      - .github/staging-deploy.trigger

concurrency:
  group: deploy-supabase-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy remediation migrations to hosted staging
    runs-on: ubuntu-latest
    environment: supabase-staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      DEPLOY_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'DEPLOY STAGING' }}

    steps:
      - name: Checkout the reviewed remediation source
        uses: actions/checkout@v4
        with:
          ref: 146eee2877e3a36949d3397dba63138ac85578b2

      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate confirmation and protected configuration
        run: |
          set -euo pipefail

          if [ "$DEPLOY_CONFIRMATION" != "DEPLOY STAGING" ]; then
            echo "::error::Confirmation did not exactly match DEPLOY STAGING. Nothing was deployed."
            exit 1
          fi

          missing=()
          [ -z "${SUPABASE_PROJECT_ID:-}" ] && missing+=("SUPABASE_PROJECT_ID environment variable")
          [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && missing+=("SUPABASE_ACCESS_TOKEN environment secret")
          [ -z "${SUPABASE_DB_PASSWORD:-}" ] && missing+=("SUPABASE_DB_PASSWORD environment secret")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required staging configuration: ${missing[*]}. See docs/STAGE_3_STAGING_SETUP.md."
            exit 1
          fi

          if ! [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::SUPABASE_PROJECT_ID is not a valid 20-character Supabase project ref."
            exit 1
          fi

          echo "Staging configuration is present. Secret values will not be printed."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create deployment diagnostics directory
        run: mkdir -p deploy-artifacts

      - name: Link to the hosted staging project
        run: set -o pipefail; supabase link --project-ref "$SUPABASE_PROJECT_ID" 2>&1 | tee deploy-artifacts/link.log

      - name: Record migration state before deployment
        run: set -o pipefail; supabase migration list --linked 2>&1 | tee deploy-artifacts/migrations-before.log

      - name: Migration dry run
        run: set -o pipefail; supabase db push --dry-run 2>&1 | tee deploy-artifacts/dry-run.log

      - name: Apply migrations to staging
        run: set -o pipefail; supabase db push 2>&1 | tee deploy-artifacts/push.log

      - name: Run hosted-safe structural and security verification
        run: |
          set -o pipefail
          supabase test db supabase/tests/database/12_hosted_structural_verification.sql --linked \
            2>&1 | tee deploy-artifacts/hosted-verification.log

      - name: Record migration state after deployment
        if: always()
        run: set -o pipefail; supabase migration list --linked 2>&1 | tee deploy-artifacts/migrations-after.log

      - name: Upload staging deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-staging-deployment-${{ steps.source.outputs.sha }}
          path: deploy-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Murphy Method Supabase staging deployment"
            echo ""
            echo "- Environment: \`supabase-staging\`"
            echo "- Source branch: \`agent/murphy-method-complete-remediation\`"
            echo "- Source commit: \`${{ steps.source.outputs.sha }}\`"
            echo "- Target: hosted staging project only"
            echo "- Production: untouched"
            echo "- Full logs: retained as a private workflow artifact for 30 days"
          } >> "$GITHUB_STEP_SUMMARY"
